<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title description">
  <title id="title">Padrão visual de fluxogramas</title>
  <desc id="description">Prancha com símbolos para início e fim, processo, decisão, entrada e saída, conector e arestas.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 34px Arial, Helvetica, sans-serif; fill: #0F172A; }
      .subtitle { font: 400 17px Arial, Helvetica, sans-serif; fill: #475569; }
      .card-title { font: 700 19px Arial, Helvetica, sans-serif; fill: #0F172A; }
      .code { font: 600 13px Consolas, monospace; fill: #64748B; }
      .label { font: 600 16px Arial, Helvetica, sans-serif; fill: #0F172A; text-anchor: middle; dominant-baseline: middle; }
      .description { font: 400 14px Arial, Helvetica, sans-serif; fill: #475569; }
      .token { font: 600 13px Consolas, monospace; fill: #334155; }
      .card { fill: #F8FAFC; stroke: #E2E8F0; stroke-width: 1.5; }
      .flow { fill: none; stroke: #475569; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="820" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1200" height="10" fill="#1D4ED8"/>
  <text x="60" y="70" class="title">Padrão visual de fluxogramas</text>
  <text x="60" y="104" class="subtitle">Uma linguagem visual única para fluxos reconhecidos, revisados e republicados.</text>

  <rect x="60" y="145" width="520" height="165" rx="16" class="card"/>
  <text x="88" y="180" class="card-title">Início / fim</text>
  <text x="88" y="203" class="code">terminator</text>
  <rect x="105" y="225" width="210" height="58" rx="29" fill="#DCFCE7" stroke="#15803D" stroke-width="2.5"/>
  <text x="210" y="255" class="label">Início</text>
  <text x="350" y="242" class="description">Marca os limites do processo.</text>
  <text x="350" y="268" class="token">#DCFCE7 · #15803D</text>

  <rect x="620" y="145" width="520" height="165" rx="16" class="card"/>
  <text x="648" y="180" class="card-title">Ação</text>
  <text x="648" y="203" class="code">process</text>
  <rect x="665" y="225" width="230" height="58" rx="10" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="2.5"/>
  <text x="780" y="255" class="label">Validar pedido</text>
  <text x="930" y="242" class="description">Uma ação por bloco.</text>
  <text x="930" y="268" class="token">#DBEAFE · #1D4ED8</text>

  <rect x="60" y="335" width="520" height="185" rx="16" class="card"/>
  <text x="88" y="370" class="card-title">Decisão</text>
  <text x="88" y="393" class="code">decision</text>
  <polygon points="210,410 315,462 210,514 105,462" fill="#FEF3C7" stroke="#B45309" stroke-width="2.5"/>
  <text x="210" y="462" class="label">Aprovado?</text>
  <text x="350" y="445" class="description">Pergunta com ramos explícitos.</text>
  <text x="350" y="473" class="token">#FEF3C7 · #B45309</text>
  <text x="350" y="501" class="description">Saídas recomendadas: Sim / Não</text>

  <rect x="620" y="335" width="520" height="185" rx="16" class="card"/>
  <text x="648" y="370" class="card-title">Entrada / saída</text>
  <text x="648" y="393" class="code">input_output</text>
  <polygon points="690,425 920,425 890,490 660,490" fill="#EDE9FE" stroke="#6D28D9" stroke-width="2.5"/>
  <text x="790" y="458" class="label">Receber dados</text>
  <text x="950" y="445" class="description">Dado recebido ou emitido.</text>
  <text x="950" y="473" class="token">#EDE9FE · #6D28D9</text>

  <rect x="60" y="545" width="520" height="170" rx="16" class="card"/>
  <text x="88" y="580" class="card-title">Conector</text>
  <text x="88" y="603" class="code">connector</text>
  <circle cx="210" cy="650" r="30" fill="#E2E8F0" stroke="#475569" stroke-width="2.5"/>
  <text x="210" y="651" class="label">A</text>
  <text x="275" y="637" class="description">Continuidade distante na mesma página.</text>
  <text x="275" y="665" class="token">#E2E8F0 · #475569</text>

  <rect x="620" y="545" width="520" height="170" rx="16" class="card"/>
  <text x="648" y="580" class="card-title">Conexões</text>
  <text x="648" y="603" class="code">edge</text>
  <path d="M680 650 H1050" class="flow"/>
  <rect x="815" y="625" width="74" height="30" rx="15" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="852" y="641" class="description" text-anchor="middle">Sim</text>
  <text x="680" y="690" class="description">Traço ortogonal, direção explícita e rótulo curto.</text>

  <line x1="60" y1="760" x2="1140" y2="760" stroke="#E2E8F0"/>
  <text x="60" y="792" class="description">SVG é o formato mestre · PDF para documentos · PNG para compatibilidade</text>
  <text x="1140" y="792" class="code" text-anchor="end">visual-standard/1.0</text>
</svg>
